<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta http-equiv="Cache-Control"
          content="no-store, no-cache, must-revalidate">

    <meta http-equiv="Pragma"
          content="no-cache">

    <meta http-equiv="Expires"
          content="0">

    <meta name="referrer"
          content="no-referrer">
	
	
	
	
    <title>String Comparator</title>
    <style>
        :root {
            --bg: #1e1e1e;
            --surface: #2a2a2a;
            --text: #e0e0e0;
            --input-bg: #d3d3d3;
            --input-text: #1e1e1e;
            --border: #555;
            --accent-green: #4caf50;
            --label-width: 120px;
            --font-mono: 'Courier New', Courier, monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #121212;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 20px;
        }

        .window {
            background-color: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            width: 100%;
            max-width: 620px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            overflow: hidden;
        }

        .window-header {
            background-color: #252525;
            padding: 10px 16px;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 1px;
            color: #aaa;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .window-header .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: #555;
        }

        .window-content {
            padding: 20px 24px 24px;
        }

        .input-area {
            margin-bottom: 24px;
        }

        .input-area:last-child {
            margin-bottom: 0;
        }

        .input-area label {
            display: block;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #aaa;
            margin-bottom: 6px;
        }

        .text-input {
            width: 100%;
            padding: 12px 14px;
            font-size: 16px;
            font-family: var(--font-mono);
            background-color: var(--input-bg);
            color: var(--input-text);
            border: 1px solid var(--border);
            border-radius: 4px;
            outline: none;
            resize: none;
            line-height: 1.4;
            height: 160px;
        }

        .text-input:focus {
            border-color: #888;
            box-shadow: 0 0 0 2px rgba(255,255,255,0.1);
        }

        /* Green highlight only when both strings match */
        .text-input.match {
            background-color: #c8e6c9;
            border-color: var(--accent-green);
            color: #1e1e1e;
        }

        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #2a2a2a;
        }
        ::-webkit-scrollbar-thumb {
            background: #555;
            border-radius: 3px;
        }
    </style>
</head>
<body>
    <div class="window">
        <div class="window-header">
            <span class="dot"></span>
            <span class="dot"></span>
            <span class="dot"></span>
            <span style="margin-left: 8px;">String Comparator</span>
        </div>
        <div class="window-content">
            <div class="input-area">
                <label for="data-input">Input string (max 256 chars)</label>
                <textarea id="data-input" class="text-input"
                          maxlength="256"
                          placeholder="Type or paste text..."
                          autocomplete="off"
                          autocorrect="off"
                          autocapitalize="off"
                          spellcheck="false"></textarea>
            </div>

            <div class="input-area">
                <label for="data-input2">Input string 2 (max 256 chars)</label>
                <textarea id="data-input2" class="text-input"
                          maxlength="256"
                          placeholder="Type or paste text to compare..."
                          autocomplete="off"
                          autocorrect="off"
                          autocapitalize="off"
                          spellcheck="false"></textarea>
            </div>
        </div>
    </div>

    <script>
        (function() {
            const MAX_LENGTH = 256;

            const inputEl = document.getElementById('data-input');
            const inputEl2 = document.getElementById('data-input2');

            let updateTimer = 0;

            // ────────── UI helpers (select all text on focus/click) ──────────
            function selectOnFocus(element) {
                element.addEventListener('focus', () => element.select());
                element.addEventListener('click', () => element.select());
            }

            [inputEl, inputEl2].forEach((input) => {
                if (!input) return;

                selectOnFocus(input);
                
                // Prevent newline insertion on Enter key
                input.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                    }
                });

                // After dropping text, place the cursor at the beginning
                input.addEventListener('drop', () => {
                    setTimeout(() => {
                        input.setSelectionRange(0, 0);
                    }, 0);
                });
            });

            // ────────── Main comparison function ──────────
            function updateComparison() {
                clearTimeout(updateTimer);
                updateTimer = setTimeout(() => {
                    const text1 = inputEl.value.slice(0, MAX_LENGTH);
                    const text2 = inputEl2.value.slice(0, MAX_LENGTH);
                    
                    // Match only if both strings are identical and not empty
                    const isMatch = text1.length > 0 && text1 === text2;
                    
                    inputEl.classList.toggle('match', isMatch);
                    inputEl2.classList.toggle('match', isMatch);
                }, 50);
            }

            // ────────── Event listeners ──────────
            inputEl.addEventListener('input', updateComparison);
            inputEl2.addEventListener('input', updateComparison);
			
			// Security
            function clearSensitiveData() {
                clearTimeout(updateTimer);
                updateTimer = 0;

                inputEl.value = '';
                inputEl2.value = '';

                inputEl.classList.remove('match');
                inputEl2.classList.remove('match');
            }

            // Clear when page is being hidden
            window.addEventListener('pagehide', clearSensitiveData);

            // Clear when restored from Back/Forward Cache
            window.addEventListener('pageshow', (event) => {
                if (event.persisted) {
                    clearSensitiveData();
                }
            });

            // Initial state (empty)
            updateComparison();
        })();
    </script>
</body>
</html>
